<section class="page">
  <h2>Get all vendors</h2>
  <p class="lede">Calls GET /api/Vendor.</p>

  <app-page-feedback [message]="message" [error]="error" />

  <div class="row">
    <button type="button" (click)="loadVendors()" [disabled]="isLoading">Refresh</button>
    <a routerLink="/vendors/create">Create vendor</a>
  </div>

  @if (isLoading) {
    <p><em>Loading vendors...</em></p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (vendor of vendors; track vendor.id) {
          <tr>
            <td>{{ vendor.id }}</td>
            <td>{{ vendor.name }}</td>
            <td>{{ vendor.address }}</td>
            <td class="actions">
              <a [routerLink]="['/vendors/lookup', vendor.id]">View</a>
              <a [routerLink]="['/vendors/update', vendor.id]">Edit</a>
              <a class="danger-link" [routerLink]="['/vendors/delete', vendor.id]">Delete</a>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4">No vendors found.</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
